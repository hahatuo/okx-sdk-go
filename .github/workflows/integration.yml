name: Integration

on:
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  okx:
    name: OKX integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache: true

      - name: Public WebSocket integration
        env:
          OKX_WS_INTEGRATION: "1"
          OKX_WS_DEPTH_INST_ID: ${{ vars.OKX_WS_DEPTH_INST_ID }}
          OKX_WS_PUBLIC_URL: ${{ vars.OKX_WS_PUBLIC_URL }}
        run: go test ./... -run TestIntegrationPublicOrderBookDepthChannels -count=1

      - name: Check private OKX secrets
        id: okx-secrets
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        run: |
          if [ -n "$OKX_API_KEY" ] && [ -n "$OKX_SECRET_KEY" ] && [ -n "$OKX_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Private REST integration
        if: steps.okx-secrets.outputs.available == 'true'
        env:
          OKX_REST_INTEGRATION: "1"
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_REST_URL: ${{ vars.OKX_REST_URL }}
        run: go test ./... -run TestIntegrationReadOnlyAccountBalance -count=1

      - name: Private REST integration skipped
        if: steps.okx-secrets.outputs.available != 'true'
        run: echo "Skipping private REST integration because OKX_API_KEY, OKX_SECRET_KEY, or OKX_PASSPHRASE is not configured."

      - name: Check demo OKX secrets
        id: okx-demo-secrets
        env:
          OKX_DEMO_API_KEY: ${{ secrets.OKX_DEMO_API_KEY }}
          OKX_DEMO_SECRET_KEY: ${{ secrets.OKX_DEMO_SECRET_KEY }}
          OKX_DEMO_PASSPHRASE: ${{ secrets.OKX_DEMO_PASSPHRASE }}
        run: |
          if [ -n "$OKX_DEMO_API_KEY" ] && [ -n "$OKX_DEMO_SECRET_KEY" ] && [ -n "$OKX_DEMO_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Demo trading integration
        if: steps.okx-demo-secrets.outputs.available == 'true'
        env:
          OKX_DEMO_TRADING_INTEGRATION: "1"
          OKX_DEMO_API_KEY: ${{ secrets.OKX_DEMO_API_KEY }}
          OKX_DEMO_SECRET_KEY: ${{ secrets.OKX_DEMO_SECRET_KEY }}
          OKX_DEMO_PASSPHRASE: ${{ secrets.OKX_DEMO_PASSPHRASE }}
          OKX_DEMO_REST_URL: ${{ vars.OKX_DEMO_REST_URL }}
          OKX_DEMO_WS_PRIVATE_URL: ${{ vars.OKX_DEMO_WS_PRIVATE_URL }}
          OKX_DEMO_INST_ID: ${{ vars.OKX_DEMO_INST_ID }}
          OKX_DEMO_TD_MODE: ${{ vars.OKX_DEMO_TD_MODE }}
          OKX_DEMO_SIDE: ${{ vars.OKX_DEMO_SIDE }}
          OKX_DEMO_SZ: ${{ vars.OKX_DEMO_SZ }}
          OKX_DEMO_PX: ${{ vars.OKX_DEMO_PX }}
        run: go test ./... -run TestIntegrationDemoTrading -count=1

      - name: Demo trading integration skipped
        if: steps.okx-demo-secrets.outputs.available != 'true'
        run: echo "Skipping demo trading integration because OKX_DEMO_API_KEY, OKX_DEMO_SECRET_KEY, or OKX_DEMO_PASSPHRASE is not configured."
